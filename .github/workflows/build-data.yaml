name: Rebuild forecast data

on:
  schedule:
    - cron: "15 18 * * 4"
  push:
    branches: [main]
    paths:
      - predtimechart-config.yml
      - .github/workflows/build-data.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-forecast-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Check out forecast hub
        uses: actions/checkout@v4
        with:
          repository: philipgerlee/swedish_forecasting_hub
          ref: main
          path: hub

      - name: Check out published forecast data
        uses: actions/checkout@v4
        with:
          ref: ptc/data
          path: published-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hub/evaluation-pipeline/pyproject.toml

      - name: Install builders
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./hub/evaluation-pipeline
          python -m pip install git+https://github.com/hubverse-org/hub-dashboard-predtimechart.git@v2.4.0

      - name: Build the Hubverse dashboard view
        working-directory: hub
        run: build-dashboard-hub-view --output-root "${{ runner.temp }}/dashboard-hub"

      - name: Generate PredTimeChart files
        run: |
          mkdir -p "${{ runner.temp }}/ptc/forecasts" "${{ runner.temp }}/ptc/targets"
          hub_predtimechart \
            "${{ runner.temp }}/dashboard-hub" \
            "${{ runner.temp }}/dashboard-hub/predtimechart-config.yml" \
            "${{ runner.temp }}/ptc/predtimechart-options.json" \
            "${{ runner.temp }}/ptc/forecasts" \
            --regenerate
          cp "${{ runner.temp }}/dashboard-hub/predtimechart-targets/"*.json \
            "${{ runner.temp }}/ptc/targets/"

      - name: Verify generated data
        run: |
          test -s "${{ runner.temp }}/ptc/predtimechart-options.json"
          test "$(find "${{ runner.temp }}/ptc/forecasts" -name '*.json' | wc -l)" -eq 99
          test "$(find "${{ runner.temp }}/ptc/targets" -name '*.json' | wc -l)" -eq 99

      - name: Publish ptc/data branch
        working-directory: published-data
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${{ runner.temp }}/ptc/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No forecast data changes to publish."
          else
            git commit -m "Update dashboard forecast data"
            git push origin HEAD:ptc/data
          fi
